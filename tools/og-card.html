<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #efe6d0; overflow: hidden;
         font-family: 'Barlow', sans-serif; }
  .wrap { display: flex; width: 100%; height: 100%; align-items: center; padding: 0 70px; gap: 56px; }
  .left { flex: 1; }
  #mark { display: block; }
  .tag { margin-top: 30px; font-size: 37px; font-weight: 700; color: #3d382e; line-height: 1.24; }
  .sub { margin-top: 18px; font-size: 27px; font-weight: 600; color: #6b6553; line-height: 1.3; }
  .url { margin-top: 30px; font-family: 'Anton', sans-serif; font-size: 27px; letter-spacing: 3px;
         color: #8a6f33; }
  .pitch { width: 430px; height: 430px; border-radius: 18px; position: relative; flex-shrink: 0;
           background: #24321b; box-shadow: 0 16px 44px rgba(33,30,26,0.3);
           background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 27px, transparent 27px 54px); }
  .pitch::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px;
                   background: rgba(244,236,216,0.14); }
  .pitch::after { content: ''; position: absolute; left: 50%; top: 50%; width: 142px; height: 142px;
                  transform: translate(-50%,-50%); border: 2px solid rgba(244,236,216,0.14); border-radius: 50%; }
  .seg { position: absolute; width: 40px; height: 40px; border-radius: 11px; background: #d8b35e;
         box-shadow: 0 0 16px rgba(216,179,94,0.42); }
  .hd { background: #f4e7bd; box-shadow: 0 0 22px rgba(216,179,94,0.7); }
  .pip { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #211e1a; top: 12px; }
  .em { position: absolute; font-size: 34px; line-height: 1; }
</style></head>
<body><div class="wrap">
  <div class="left">
    <canvas id="mark" width="1120" height="440"></canvas>
    <div class="tag">Eat to grow.<br>Survive the pitch.</div>
    <div class="sub">Five players, one ball, and ghosts that hunt you.</div>
    <div class="url">PITCHSNAKE.COM</div>
  </div>
  <div class="pitch">
    <div class="seg hd" style="left:270px; top:130px">
      <div class="pip" style="left:9px"></div><div class="pip" style="left:24px"></div>
    </div>
    <div class="seg" style="left:225px; top:130px"></div>
    <div class="seg" style="left:180px; top:130px"></div>
    <div class="seg" style="left:180px; top:175px"></div>
    <div class="seg" style="left:180px; top:220px"></div>
    <div class="seg" style="left:135px; top:220px"></div>
    <div class="seg" style="left:90px;  top:220px"></div>
    <div class="seg" style="left:90px;  top:265px"></div>
    <div class="em" style="left:322px; top:288px">⚽</div>
    <div class="em" style="left:78px;  top:88px">👻</div>
    <div class="em" style="left:330px; top:66px">👻</div>
  </div>
</div>

<script>
// The wordmark is drawn rather than laid out, because the snake has to sit ON
// the cap height of the letters beside it and CSS will not tell you where that
// is. Canvas will: measureText's actualBoundingBoxAscent is the real ink top of
// the glyph in this exact face at this exact size, so the segments are placed
// against the letters' own geometry instead of a guessed offset.
function draw() {
  const c = document.getElementById('mark'), x = c.getContext('2d');
  const SIZE = 122, INK = '#211e1a', GOLD = '#c2a25a', DROP = 6, SCALE = 2;
  const font = SIZE + "px Anton, sans-serif";

  // Measure first, size the canvas to the ink, and only then draw. A canvas
  // bigger than its artwork is invisible padding that shoves the rest of the
  // card off the edge, which is exactly what a fixed guess did here.
  x.font = font;
  const cap  = x.measureText('H').actualBoundingBoxAscent;
  const stem = x.measureText('I').width;
  const wP = x.measureText('P').width, wTCH = x.measureText('TCH').width;
  const wSNAKE = x.measureText('SNAKE').width;
  const line1 = 0, line2 = cap * 1.16;
  const W = Math.ceil(Math.max(wP + stem + wTCH, wSNAKE) + DROP + 2);
  const H = Math.ceil(line2 + cap + DROP + 2);

  c.width = W * SCALE; c.height = H * SCALE;
  c.style.width = W + 'px'; c.style.height = H + 'px';
  x.scale(SCALE, SCALE);
  x.font = font; x.textBaseline = 'alphabetic';

  const gap = Math.round(cap * 0.05);
  const segH = (cap - gap * 2) / 3;
  const segW = stem * 0.88;
  const radius = segW * 0.3;
  const sx = wP + (stem - segW) / 2;

  // Painted twice: the gold drop first, offset, then the ink over it. That is
  // the wordmark's existing look, and the snake has to share it or it stops
  // reading as a letter and starts reading as a picture dropped into a word.
  for (const pass of [{ d: DROP, fill: GOLD }, { d: 0, fill: INK }]) {
    x.fillStyle = pass.fill;
    x.fillText('P', pass.d, line1 + cap + pass.d);
    for (let i = 0; i < 3; i++) {
      x.beginPath();
      x.roundRect(sx + pass.d, line1 + i * (segH + gap) + pass.d, segW, segH, radius);
      x.fill();
    }
    x.fillText('TCH', wP + stem + pass.d, line1 + cap + pass.d);
    x.fillText('SNAKE', pass.d, line2 + cap + pass.d);
  }

  // Eyes punched in the page's cream, so they read as holes in the head rather
  // than dots sitting on it. Head is the LAST segment: the snake is going down.
  const headY = line1 + 2 * (segH + gap);
  x.fillStyle = '#efe6d0';
  for (const ex of [sx + segW * 0.3, sx + segW * 0.7]) {
    x.beginPath(); x.arc(ex, headY + segH * 0.6, segW * 0.12, 0, 7); x.fill();
  }
  document.body.dataset.drawn = '1';
}
document.fonts.ready.then(draw);
</script>
</body></html>
