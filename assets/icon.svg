<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pitch Snake">
  <!-- The logo's own signature detail, on its own: the I of PITCH as a snake
       going down, three segments with the head at the bottom.

       The whole wordmark cannot be the icon. A tab favicon is read at 16px and
       two stacked words turn to mush there, so the icon is the one piece of the
       logo that still reads at that size and is unmistakably this game. The
       green and the halfway line carry the pitch; the segments carry the snake.

       Pure shapes on purpose, no <text>: an icon does not reliably get a
       webfont, so anything lettered here would fall back to whatever the
       browser had and stop being the logo at all. -->
  <rect width="64" height="64" rx="13" fill="#24321b"/>
  <line x1="32" y1="0" x2="32" y2="64" stroke="#f4ecd8" stroke-opacity="0.10" stroke-width="2"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#f4ecd8" stroke-opacity="0.10" stroke-width="2"/>
  <g fill="#d8b35e">
    <rect x="22" y="7"  width="20" height="16" rx="5"/>
    <rect x="22" y="25" width="20" height="16" rx="5"/>
  </g>
  <rect x="22" y="43" width="20" height="16" rx="5" fill="#f4e7bd"/>
  <g fill="#211e1a">
    <circle cx="28.5" cy="52.5" r="2.4"/>
    <circle cx="35.5" cy="52.5" r="2.4"/>
  </g>
</svg>
