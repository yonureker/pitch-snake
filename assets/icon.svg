<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pitch Snake">
  <!-- Legibility at 16px is the whole brief: a tab icon is read at a glance and
       at a size where detail is noise. So this is the pitch's green, three gold
       segments turning a corner, and the ball. Nothing else survives the scale. -->
  <rect width="64" height="64" rx="13" fill="#24321b"/>
  <line x1="32" y1="0" x2="32" y2="64" stroke="#f4ecd8" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#f4ecd8" stroke-opacity="0.12" stroke-width="2"/>
  <rect x="9"  y="17" width="15" height="15" rx="4.5" fill="#d8b35e"/>
  <rect x="9"  y="34" width="15" height="15" rx="4.5" fill="#d8b35e"/>
  <rect x="26" y="34" width="15" height="15" rx="4.5" fill="#f4e7bd"/>
  <circle cx="49" cy="20" r="7" fill="#f6f2e6"/>
  <path d="M49 14.5l2.6 1.9-1 3.1h-3.2l-1-3.1z" fill="#211e1a"/>
</svg>
